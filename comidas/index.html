<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Comidas libres">
<meta name="theme-color" content="#16a34a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Comidas libres</title>
<style>
  :root {
    --bg: #f5f5f4; --card: #fff; --text: #1c1917; --muted: #78716c;
    --accent: #16a34a; --accent-soft: #dcfce7; --danger: #dc2626; --border: #e7e5e4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0a09; --card: #1c1917; --text: #fafaf9; --muted: #a8a29e;
      --accent: #22c55e; --accent-soft: #14532d; --danger: #f87171; --border: #292524;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px);
  }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 8px; }
  h1 { font-size: 28px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 24px 4px 8px; }
  .card { background: var(--card); border-radius: 14px; padding: 16px; border: 1px solid var(--border); }
  .quota { display: flex; align-items: center; gap: 16px; }
  .quota .big { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .quota .big.over { color: var(--danger); }
  .bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; background: var(--accent); transition: width .3s; }
  .bar > div.over { background: var(--danger); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input, select, textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
  }
  textarea { min-height: 70px; resize: vertical; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button {
    flex: none; border: 1px solid var(--border); background: var(--bg); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px;
  }
  .chips button.on { background: var(--accent-soft); border-color: var(--accent); }
  .btn {
    display: block; width: 100%; border: 0; border-radius: 12px; padding: 14px;
    font: inherit; font-weight: 600; background: var(--accent); color: #fff; margin-top: 16px;
  }
  .btn.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn.small { display: inline-block; width: auto; padding: 8px 14px; margin: 0; font-size: 14px; }
  .icon-btn { background: none; border: 0; font-size: 22px; color: var(--text); padding: 4px 8px; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { padding: 12px 0; border-bottom: 1px solid var(--border); display: flex; gap: 12px; }
  ul.list li:last-child { border-bottom: 0; }
  .meta { font-size: 13px; color: var(--muted); }
  .desc { font-weight: 600; }
  .grow { flex: 1; min-width: 0; }
  .tag { font-size: 12px; background: var(--accent-soft); border-radius: 6px; padding: 2px 6px; }
  .empty { color: var(--muted); text-align: center; padding: 16px 0; }
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%;
  }
  .toast.show { opacity: 1; }
  .hidden { display: none; }
  .stars button { font-size: 24px; background: none; border: 0; padding: 0 4px; opacity: .3; }
  .stars button.on { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Comidas libres</h1>
  <button class="icon-btn" id="btnSettings" aria-label="Ajustes">⚙️</button>
</header>

<section class="card quota">
  <div class="big" id="quotaUsed">0</div>
  <div class="grow">
    <div><strong id="quotaText">de 0 esta semana</strong></div>
    <div class="meta" id="quotaRange"></div>
    <div class="bar"><div id="quotaBar" style="width:0"></div></div>
  </div>
</section>

<h2 id="formTitle">Registrar comida libre</h2>
<form class="card" id="form" autocomplete="off">
  <div class="row">
    <div><label for="fDate">Fecha</label><input type="date" id="fDate" required></div>
    <div><label for="fTime">Hora</label><input type="time" id="fTime" required></div>
  </div>

  <label>Momento</label>
  <div class="chips" id="fMeal"></div>

  <label>¿Qué incluyó? <span class="meta">(cada una suma ⅓)</span></label>
  <div class="chips" id="fParts"></div>
  <div class="meta" id="fPartsValue" style="margin-top:6px"></div>

  <label for="fDesc">¿Qué comiste?</label>
  <input id="fDesc" placeholder="Ej: pizza con amigos, 3 porciones" required>

  <label for="fPlace">Dónde / con quién</label>
  <input id="fPlace" placeholder="Opcional">

  <label>¿Cuánto lo disfrutaste?</label>
  <div class="stars" id="fRating"></div>

  <label for="fNotes">Notas</label>
  <textarea id="fNotes" placeholder="Hambre, saciedad, cómo te sentiste…"></textarea>

  <button class="btn" type="submit" id="btnSave">Guardar</button>
  <button class="btn secondary hidden" type="button" id="btnCancel">Cancelar edición</button>
</form>

<h2>Historial</h2>
<div class="card">
  <ul class="list" id="list"></ul>
</div>

<h2>Excel</h2>
<div class="card">
  <p class="meta" style="margin-top:0">Los datos viven en el iPhone. Exportá un <b>.xlsx</b> para guardarlo en Archivos / iCloud Drive, o importá uno para restaurar.</p>
  <div class="row">
    <button class="btn small" id="btnExport" type="button">Exportar .xlsx</button>
    <button class="btn small secondary" id="btnImport" type="button">Importar .xlsx</button>
  </div>
  <input type="file" id="fileInput" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="hidden">
</div>

<section id="settings" class="hidden">
  <h2>Ajustes</h2>
  <div class="card">
    <label for="sQuota">Comidas libres permitidas por semana</label>
    <input type="number" id="sQuota" min="0" max="21" inputmode="numeric">
    <label for="sWeekStart">La semana empieza el</label>
    <select id="sWeekStart">
      <option value="1">Lunes</option>
      <option value="0">Domingo</option>
    </select>
    <label>Horarios para detectar el momento (hora de inicio)</label>
    <div class="row">
      <div><label for="sRangeDesayuno">Desayuno</label><input type="time" id="sRangeDesayuno"></div>
      <div><label for="sRangeAlmuerzo">Almuerzo</label><input type="time" id="sRangeAlmuerzo"></div>
    </div>
    <div class="row">
      <div><label for="sRangeMerienda">Merienda</label><input type="time" id="sRangeMerienda"></div>
      <div><label for="sRangeCena">Cena</label><input type="time" id="sRangeCena"></div>
    </div>
    <p class="meta">Antes del desayuno (madrugada) cuenta como cena.</p>
    <button class="btn" type="button" id="btnSaveSettings">Guardar ajustes</button>
    <button class="btn secondary" type="button" id="btnWipe" style="color:var(--danger)">Borrar todos los datos</button>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="vendor/xlsx.mini.min.js"></script>
<script src="app.js"></script>
</body>
</html>
