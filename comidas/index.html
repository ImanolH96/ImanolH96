<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Comidas libres">
<meta name="theme-color" content="#1b2656">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Comidas libres</title>
<style>
  @font-face {
    font-family: "Bricolage";
    src: url("fonts/bricolage.woff2") format("woff2");
    font-weight: 200 800;
    font-display: swap;
  }
  :root {
    color-scheme: dark;
    --ink: #1b2656;        /* cobalt ground */
    --ink-deep: #121a3d;   /* key shadows, sheet backdrop */
    --panel: #26336b;      /* sheets, inputs */
    --line: #3a4884;
    --paper: #f4f2ff;      /* main text */
    --muted: #a3acd6;
    --comida: #f4b63f;     /* mustard */
    --comida-deep: #b9811a;
    --alcohol: #d84a78;    /* wine */
    --alcohol-deep: #93224a;
    --postre: #f7a8cb;     /* strawberry milk */
    --postre-deep: #c06d93;
    --over: #ff7a6b;
    --font: "Bricolage", ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--ink); }
  body {
    margin: 0; min-height: 100%;
    background: var(--ink); color: var(--paper);
    font: 400 16px/1.4 var(--font);
    padding: env(safe-area-inset-top, 0px) 16px calc(env(safe-area-inset-bottom, 0px) + 32px);
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  button { font: inherit; color: inherit; -webkit-appearance: none; appearance: none; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 3px solid var(--paper); outline-offset: 2px;
  }
  .hidden, [hidden] { display: none !important; }

  /* ---------- top: week punch card ---------- */
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-top: 16px; }
  .week-title { margin: 0; font-size: 15px; font-weight: 500; color: var(--muted); }
  .week-left {
    margin: 2px 0 0; font-size: 44px; line-height: 1; font-weight: 800;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em; text-wrap: balance;
  }
  .week-left small { display: block; font-size: 17px; font-weight: 500; letter-spacing: 0; margin-top: 6px; }
  .week-left.over { color: var(--over); }
  .gear { background: none; border: 0; padding: 8px; margin: -4px -8px 0 0; color: var(--muted); }
  .gear svg { display: block; width: 26px; height: 26px; }
  .punch { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .punch svg { width: 48px; height: 48px; display: block; }
  .punch .slot { fill: none; stroke: var(--line); stroke-width: 2; }
  .punch .slot.extra { stroke: var(--over); stroke-dasharray: 4 3; }
  .punch .divider { stroke: var(--ink); stroke-width: 2.5; }
  .punch .wedge.fresh { animation: stamp .45s cubic-bezier(.2, 1.6, .4, 1); transform-origin: 24px 24px; }
  @keyframes stamp { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* ---------- context: when ---------- */
  .when { display: flex; flex-direction: column; gap: 10px; }
  .when-line { margin: 0; font-size: 22px; font-weight: 700; }
  .when-line span { color: var(--muted); font-weight: 500; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button {
    position: relative; border: 1.5px solid var(--line); background: transparent; color: var(--paper);
    border-radius: 999px; padding: 7px 13px; font-size: 15px; line-height: 1.2; font-weight: 500;
  }
  .seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-color: var(--paper); }
  .days { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .days button {
    border: 1.5px solid var(--line); background: transparent; border-radius: 14px; padding: 12px 4px;
    font-size: 15px; font-weight: 600; line-height: 1.2;
  }
  .days button small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
  .days button[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-color: var(--paper); }
  .days button[aria-pressed="true"] small { color: var(--ink); }

  /* ---------- the keypad ---------- */
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .key {
    --c: var(--comida); --d: var(--comida-deep);
    position: relative; border: 0; border-radius: 22px; background: var(--c); color: var(--ink-deep);
    min-height: 150px; padding: 14px 8px 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    box-shadow: 0 7px 0 var(--d); transform: translateY(0);
    transition: transform .06s, box-shadow .06s;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .key[data-part="alcohol"] { --c: var(--alcohol); --d: var(--alcohol-deep); color: #fff; }
  .key[data-part="postre"] { --c: var(--postre); --d: var(--postre-deep); }
  .key:active, .key.pressed { transform: translateY(6px); box-shadow: 0 1px 0 var(--d); }
  .key .emoji { font-size: 46px; line-height: 1; }
  .key .name { font-size: 18px; font-weight: 700; line-height: 1.1; text-align: center; }
  .key .done {
    position: absolute; top: 8px; right: 10px; font-size: 13px; font-weight: 700;
    background: var(--ink-deep); color: var(--paper); border-radius: 999px; padding: 2px 8px;
  }
  .hint { margin: -14px 0 0; font-size: 14px; color: var(--muted); text-align: center; }

  /* ---------- log ---------- */
  .log h2 { margin: 0 0 6px; font-size: 18px; font-weight: 700; }
  .log ul { list-style: none; margin: 0; padding: 0; }
  .log li + li { border-top: 1px solid var(--line); }
  .entry {
    width: 100%; background: none; border: 0; text-align: left; padding: 12px 0;
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
  }
  .entry .dots { display: flex; gap: 4px; }
  .entry .dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line); }
  .entry .what { min-width: 0; }
  .entry .what b { display: block; font-weight: 600; }
  .entry .what span { display: block; font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry .val { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 17px; }
  .empty { color: var(--muted); margin: 4px 0 0; }
  .more { background: none; border: 0; color: var(--muted); padding: 10px 0 0; text-decoration: underline; }

  .foot { display: flex; gap: 8px; flex-wrap: wrap; }
  .ghost {
    border: 1.5px solid var(--line); background: transparent; border-radius: 12px;
    padding: 10px 14px; font-size: 15px; font-weight: 500;
  }

  /* ---------- toast with undo ---------- */
  .toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    max-width: 448px; margin: 0 auto; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--paper); color: var(--ink); border-radius: 16px; padding: 12px 12px 12px 16px;
    font-weight: 600; box-shadow: 0 10px 30px rgb(0 0 0 / .35);
    transform: translateY(140%); transition: transform .25s cubic-bezier(.2, .9, .3, 1);
  }
  .toast.show { transform: translateY(0); }
  .toast button { border: 0; background: var(--ink); color: var(--paper); border-radius: 10px; padding: 8px 12px; font-weight: 700; flex: none; }

  /* ---------- bottom sheets ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 30; background: rgb(8 12 32 / .6);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
    background: var(--panel); border-radius: 24px 24px 0 0;
    padding: 20px 16px calc(env(safe-area-inset-bottom, 0px) + 20px);
    display: flex; flex-direction: column; gap: 14px;
    animation: rise .25s cubic-bezier(.2, .9, .3, 1);
  }
  @keyframes rise { from { transform: translateY(40%); opacity: 0; } }
  .sheet h3 { margin: 0; font-size: 20px; font-weight: 700; }
  .sheet p { margin: 0; color: var(--muted); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > span { font-size: 14px; color: var(--muted); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sheet input, .sheet select, .sheet textarea {
    display: block; width: 100%; min-width: 0; min-height: 46px; margin: 0;
    font: inherit; font-size: 16px; color: var(--paper); background: var(--ink);
    border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px;
    -webkit-appearance: none; appearance: none;
  }
  .sheet input[type="date"], .sheet input[type="time"] { line-height: 24px; text-align: left; }
  .sheet input::-webkit-date-and-time-value { text-align: left; margin: 0; }
  .sheet textarea { min-height: 76px; resize: vertical; }
  .parts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .parts button {
    border: 1.5px solid var(--line); background: transparent; border-radius: 14px; padding: 10px 4px;
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 14px; font-weight: 600;
  }
  .parts button span { font-size: 26px; filter: grayscale(1); opacity: .5; }
  .parts button[aria-pressed="true"] { border-color: var(--paper); background: var(--ink); }
  .parts button[aria-pressed="true"] span { filter: none; opacity: 1; }
  .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .solid {
    border: 0; border-radius: 14px; padding: 14px; font-size: 17px; font-weight: 700;
    background: var(--paper); color: var(--ink);
  }
  .solid.danger { background: var(--over); color: var(--ink-deep); }
  .link { background: none; border: 0; padding: 10px; color: var(--muted); font-weight: 500; }
  .link.danger { color: var(--over); }

  @media (max-width: 350px) {
    .key { min-height: 128px; }
    .key .emoji { font-size: 38px; }
    .key .name { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <section class="top" aria-live="polite">
    <div>
      <p class="week-title" id="weekTitle">Esta semana</p>
      <p class="week-left" id="weekLeft">2<small>comidas libres disponibles</small></p>
      <div class="punch" id="punch" aria-hidden="true"></div>
    </div>
    <button class="gear" id="btnSettings" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </section>

  <section class="when">
    <p class="when-line" id="whenLine">Cena <span>de hoy</span></p>
    <div class="seg" id="segMeal" role="group" aria-label="Momento"></div>
    <div class="seg" id="segDay" role="group" aria-label="Día">
      <button type="button" data-day="0">Hoy</button>
      <button type="button" data-day="1">Ayer</button>
      <button type="button" id="dayOtherBtn">Otro día</button>
    </div>
  </section>

  <section class="pad" id="pad" aria-label="Registrar">
    <button class="key" data-part="comida" type="button"><span class="emoji">🍔</span><span class="name">Comida</span></button>
    <button class="key" data-part="alcohol" type="button"><span class="emoji">🍷</span><span class="name">Alcohol</span></button>
    <button class="key" data-part="postre" type="button"><span class="emoji">🍰</span><span class="name">Postre</span></button>
  </section>
  <p class="hint">Cada toque suma ⅓. Las tres juntas son una comida libre.</p>

  <section class="log">
    <h2>Registros</h2>
    <ul id="list"></ul>
    <button class="more hidden" id="btnMore" type="button">Ver más</button>
  </section>

  <section class="foot">
    <button class="ghost" id="btnExport" type="button">Exportar Excel</button>
    <button class="ghost" id="btnImport" type="button">Importar Excel</button>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="hidden">
  </section>
</main>

<!-- edit an entry -->
<div class="scrim" id="editSheet" hidden>
  <form class="sheet" id="editForm" autocomplete="off" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <h3 id="editTitle">Detalle</h3>
    <div class="parts" id="editParts"></div>
    <div class="row">
      <label class="field"><span>Día</span><input type="date" id="eDate" required></label>
      <label class="field"><span>Hora</span><input type="time" id="eTime" required></label>
    </div>
    <label class="field"><span>Momento</span>
      <select id="eMeal"></select>
    </label>
    <label class="field"><span>Qué fue (opcional)</span><input id="eDesc" placeholder="Pizza con amigos"></label>
    <label class="field"><span>Notas (opcional)</span><textarea id="eNotes" placeholder="Dónde, con quién, cómo te sentiste"></textarea></label>
    <div class="actions">
      <button class="solid" type="submit">Guardar cambios</button>
      <button class="link danger" type="button" id="eDelete">Borrar registro</button>
      <button class="link" type="button" data-close>Cerrar</button>
    </div>
  </form>
</div>

<!-- pick another day -->
<div class="scrim" id="daySheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dayTitle">
    <h3 id="dayTitle">¿Qué día fue?</h3>
    <div class="days" id="dayGrid"></div>
    <label class="field"><span>O elegí una fecha</span><input type="date" id="dayPick"></label>
    <div class="actions">
      <button class="solid" type="button" id="dayUse">Usar esta fecha</button>
      <button class="link" type="button" data-close>Cerrar</button>
    </div>
  </div>
</div>

<!-- settings -->
<div class="scrim" id="settingsSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h3 id="settingsTitle">Ajustes</h3>
    <div class="row">
      <label class="field"><span>Comidas libres por semana</span><input type="number" id="sQuota" min="0" max="21" step="1" inputmode="numeric"></label>
      <label class="field"><span>La semana empieza</span>
        <select id="sWeekStart"><option value="1">Lunes</option><option value="0">Domingo</option></select>
      </label>
    </div>
    <p>Hora en que empieza cada momento. Antes del desayuno cuenta como cena.</p>
    <div class="row">
      <label class="field"><span>Desayuno</span><input type="time" id="sRangeDesayuno"></label>
      <label class="field"><span>Almuerzo</span><input type="time" id="sRangeAlmuerzo"></label>
      <label class="field"><span>Merienda</span><input type="time" id="sRangeMerienda"></label>
      <label class="field"><span>Cena</span><input type="time" id="sRangeCena"></label>
    </div>
    <div class="actions">
      <button class="solid" type="button" id="btnSaveSettings">Guardar ajustes</button>
      <button class="link danger" type="button" id="btnWipe">Borrar todos los registros</button>
      <button class="link" type="button" data-close>Cerrar</button>
    </div>
  </div>
</div>

<!-- confirmation -->
<div class="scrim" id="dialog" hidden>
  <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="dialogMsg">
    <h3 id="dialogMsg"></h3>
    <div class="actions" id="dialogActions"></div>
  </div>
</div>

<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button type="button" id="toastUndo">Deshacer</button></div>

<script src="vendor/xlsx.mini.min.js"></script>
<script src="app.js"></script>
</body>
</html>
